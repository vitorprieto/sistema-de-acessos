spring.application.name=auth-service

# Datasource (override via environment variables in real environments)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_service}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate — schema is owned by Flyway, never by Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (override the secret per environment — must be Base64, >= 256 bits)
app.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXZlbG9wbWVudC1vbmx5LXNlY3JldC1rZXk=}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000
